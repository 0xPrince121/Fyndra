[package]
name = "fyndra-cli"
version = "0.1.0"
edition = "2021"
authors = ["0xPrince <https://github.com/0xPrince121>"]
license = "MIT"
description = "Lightning-fast CLI file search tool for Linux"
repository = "https://github.com/0xPrince121/Fyndra"

[dependencies]
fyndra-core = { path = "../fyndra-core" }
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
human_bytes = "0.4"
chrono = "0.4"
serde_json = "1.0"
